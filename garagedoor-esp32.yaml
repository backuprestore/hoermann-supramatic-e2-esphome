esphome:
  name: garagedoor-esp32
  friendly_name: garagedoor-esp32

esp32:
  board: lolin_s2_mini
  framework:
    type: arduino

logger:
  baud_rate: 0
  level: INFO         # Standardlevel
  logs:
    garage_door: INFO   # nur unsere Komponente ganz ausführlich
    

api:
  encryption:
    key: "asdfasdfasdfasdf"

ota:
  platform: esphome
  password: "asdfasdfasdfasdf"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "garagedoor Fallback Hotspot"
    password: "asdfasdfasdf"

captive_portal:

uart:
  id: modbus_uart
  tx_pin: GPIO39
  rx_pin: GPIO37
  baud_rate: 19200
  data_bits: 8
  stop_bits: 1
  parity: NONE
    # Reines Mithören zu Debug-Zwecken, komplett unabhängig von unserer eigenen
  # garage_door-Komponente (kein CRC, kein Framing, keine Adress-Logik - nur
  # rohe Bytes). Direction RX = wir loggen nur, was ankommt, nichts was wir
  # selbst senden. Damit lässt sich zweifelsfrei klären, ob überhaupt Bytes
  # am UART ankommen, bevor man Wiring/Polarität weiter debuggt.
  #debug:
  #  direction: RX
  #  after:
  #    timeout: 50ms

output:
  - platform: gpio
    id: modbus_write_enable
    pin: GPIO35

external_components:
  - source: components

# Hub-Komponente: übernimmt UART-Kommunikation mit dem Hörmann-Bus
# (CRC8, Frame-Parsing, Slave-Emulation). Stellt Lüftung/Licht als Switches
# und optional den rohen Status als Text-Sensor bereit (nützlich zur
# Fehlersuche, z.B. um "error" zu sehen, das das Cover-Entity nicht zeigt).
garage_door:
  id: garage_door_comp
  uart_id: modbus_uart
  write_enable_pin: modbus_write_enable
  # own_address: 0x28  # nur ändern, falls Adresskonflikt mit einem echten UAP1 am Bus

  state_sensor:
    name: "esp_garage_door_state"
  venting_switch:
    name: "esp_garage_door_venting_position"
  light_switch:
    name: "esp_garage_door_light_toggle"
  emergency_stop_button:
    name: "esp_garage_door_emergency_stop"
  impulse_button:
    name: "esp_garage_door_impulse"

# Echtes Cover-Entity: Zustand kommt vom tatsächlichen Bus-Status
# (Broadcast-Auswertung), nicht mehr "optimistic" geraten wie zuvor.
cover:
  - platform: garage_door
    id: garage_door_cover
    name: "esp_garage_door"
    device_class: garage
    garage_door_id: garage_door_comp
